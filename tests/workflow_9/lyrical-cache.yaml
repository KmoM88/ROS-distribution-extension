name: lyrical
type: cache
version: 2
distribution_file:
  type: distribution
  version: 3
  release_platforms:
    ubuntu: [noble]
  extends:
    - distro_name: jetty
      extension_method: source_rebuild
  repositories:
    common_interfaces:
      release:
        packages: [std_msgs]
        tags: {release: 'release/rolling/{package}/{version}'}
        url: https://github.com/ros2-gbp/common_interfaces-release.git
        version: 5.9.2-2
      status: maintained
    ros_tutorials:
      release:
        packages: [turtlesim]
        tags: {release: 'release/rolling/{package}/{version}'}
        url: https://github.com/ros2-gbp/ros_tutorials-release.git
        version: 1.9.2-1
      status: maintained
release_package_xmls:
  std_msgs: '<package format="3"><name>std_msgs</name><version>5.9.2</version><description>Standard ROS Messages</description><maintainer email="test@test.com">Test</maintainer><license>Apache-2.0</license></package>'
  turtlesim: '<package format="3"><name>turtlesim</name><version>1.9.2</version><description>Turtlesim</description><maintainer email="test@test.com">Test</maintainer><license>BSD</license></package>'
source_repo_package_xmls: {}
